<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>批量處理結果</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        h1 { text-align: center; margin-bottom: 25px; font-size: 24px; }

        .summary {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .summary-card {
            flex: 1;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .summary-card.success { background: rgba(72, 187, 120, 0.15); border: 1px solid rgba(72, 187, 120, 0.3); }
        .summary-card.failed { background: rgba(220, 53, 69, 0.15); border: 1px solid rgba(220, 53, 69, 0.3); }
        .summary-card.total { background: rgba(79, 140, 247, 0.15); border: 1px solid rgba(79, 140, 247, 0.3); }
        .summary-card .num { font-size: 32px; font-weight: 700; }
        .summary-card.success .num { color: #48bb78; }
        .summary-card.failed .num { color: #fc8181; }
        .summary-card.total .num { color: #4f8cf7; }
        .summary-card .label { font-size: 13px; color: #a0aec0; margin-top: 5px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
        }
        th { background: rgba(0, 0, 0, 0.25); color: #a0aec0; font-weight: 600; }
        td.hash { font-family: monospace; font-size: 11px; color: #a0aec0; word-break: break-all; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-badge.success, .status-badge.clean { background: rgba(72, 187, 120, 0.2); color: #48bb78; }
        .status-badge.failed, .status-badge.tampered { background: rgba(220, 53, 69, 0.2); color: #fc8181; }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #4f8cf7, #2c7be5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(44, 123, 229, 0.4); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); box-shadow: none; }
        .actions { text-align: center; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 批量處理結果</h1>

        <div class="summary" id="summary"></div>

        <table>
            <thead>
                <tr>
                    <th>文件名</th>
                    <th>狀態</th>
                    <th>哈希 / 原因</th>
                </tr>
            </thead>
            <tbody id="result-body"></tbody>
        </table>

        <div class="actions">
            <a href="/" class="btn">返回首頁</a>
            <a href="/admin/dashboard" class="btn btn-secondary">管理員面板</a>
        </div>
    </div>

    <script>
        const results = JSON.parse(sessionStorage.getItem('batchResults') || '{}');
        const operation = sessionStorage.getItem('batchOperation') || 'verify';

        let successCount = 0, failedCount = 0, total = 0;
        const tbody = document.getElementById('result-body');

        for (const [taskId, result] of Object.entries(results)) {
            total++;
            const row = document.createElement('tr');

            let statusText = '', statusClass = '', hashOrReason = '';
            const fileName = result.pdf_file || result.contract_no || '未知文件';

            if (result.status === 'success' || result.status === 'clean') {
                successCount++;
                statusText = result.status === 'clean' ? '未篡改' : '錄入成功';
                statusClass = 'success';
                hashOrReason = (result.pdf_hash || result.actual_hash || '').slice(0, 32) + '...';
            } else {
                failedCount++;
                statusText = result.status === 'tampered' ? '已篡改' : '失敗';
                statusClass = result.status === 'tampered' ? 'tampered' : 'failed';
                hashOrReason = result.reason || '哈希不匹配';
            }

            row.innerHTML = `
                <td>${fileName}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td class="hash">${hashOrReason}</td>
            `;
            tbody.appendChild(row);
        }

        document.getElementById('summary').innerHTML = `
            <div class="summary-card total">
                <div class="num">${total}</div>
                <div class="label">總計</div>
            </div>
            <div class="summary-card success">
                <div class="num">${successCount}</div>
                <div class="label">成功</div>
            </div>
            <div class="summary-card failed">
                <div class="num">${failedCount}</div>
                <div class="label">失敗</div>
            </div>
        `;
    </script>
</body>
</html>
