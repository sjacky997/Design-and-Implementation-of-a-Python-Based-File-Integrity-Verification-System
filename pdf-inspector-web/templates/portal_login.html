<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統登錄 - PDF 完整性檢測系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 460px;
            width: 100%;
        }

        .header { text-align: center; margin-bottom: 35px; }
        .header .icon { font-size: 60px; margin-bottom: 15px; }
        .header h1 {
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header p {
            color: #a0aec0;
            font-size: 14px;
            line-height: 1.6;
        }

        .flash {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .flash.error {
            background: rgba(220, 53, 69, 0.15);
            color: #fc8181;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        .flash.success {
            background: rgba(40, 167, 69, 0.15);
            color: #48bb78;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #e2e8f0;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #4f8cf7;
            box-shadow: 0 0 0 3px rgba(79, 140, 247, 0.2);
        }

        input::placeholder {
            color: #718096;
            letter-spacing: normal;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4f8cf7, #2c7be5);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #5a97f8, #3a87eb);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(44, 123, 229, 0.4);
        }

        .hint {
            font-size: 11px;
            color: #718096;
            margin-top: 8px;
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            background: linear-gradient(135deg, #4f8cf7, #2c7be5);
            color: white;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🔒</div>
            <h1>PDF 完整性檢測系統</h1>
            <p>基於國密 SM2/SM3 的文件防篡改驗證平台</p>
            <span class="logo-badge">系統入口</span>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <div class="form-group">
                <label for="password">系統訪問密碼</label>
                <input type="password" name="password" id="password"
                       placeholder="請輸入系統訪問密碼" required autofocus
                       autocomplete="current-password">
                <div class="hint">首次使用請聯繫系統管理員獲取訪問密碼</div>
            </div>
            <button type="submit" class="btn">進入系統</button>
        </form>
    </div>

    <!-- 🆕 設置 portal 分頁標記 -->
    <script>
        sessionStorage.setItem('portal_tab', 'active');
    </script>
</body>
</html>
