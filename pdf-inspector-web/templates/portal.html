<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能選擇 - PDF 完整性檢測系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-status {
            display: flex;
            align-items: center;
            color: #48bb78;
            font-weight: 600;
            font-size: 13px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #48bb78;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #48bb78;
        }

        .logout-btn {
            color: #a0aec0;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s ease;
            font-size: 13px;
        }
        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .header p {
            color: #a0aec0;
            font-size: 15px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .choice-grid { grid-template-columns: 1fr; }
        }

        .choice-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            display: block;
            cursor: pointer;
        }

        .choice-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .choice-card.verify:hover {
            border-color: #48bb78;
            background: rgba(72, 187, 120, 0.08);
        }

        .choice-card.admin:hover {
            border-color: #4f8cf7;
            background: rgba(79, 140, 247, 0.08);
        }

        .choice-card .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .choice-card h2 {
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .choice-card p {
            color: #a0aec0;
            font-size: 13px;
            line-height: 1.7;
        }

        .choice-card .tag {
            display: inline-block;
            margin-top: 15px;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
        }

        .choice-card.verify .tag {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
        }

        .choice-card.admin .tag {
            background: rgba(79, 140, 247, 0.2);
            color: #4f8cf7;
        }

        .flash {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .flash.success {
            background: rgba(40, 167, 69, 0.15);
            color: #48bb78;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        .flash.error {
            background: rgba(220, 53, 69, 0.15);
            color: #fc8181;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
    </style>

    <!-- 🆕 檢查 sessionStorage，若為新分頁則強制登出 -->
    <script>
        (function() {
            if (sessionStorage.getItem('portal_tab') !== 'active') {
                window.location.replace('/force_portal_logout');
            }
        })();
    </script>
</head>
<body>
    <div class="container">

        <!-- 頂部用戶信息欄 -->
        <div class="top-bar">
            <div class="user-status">
                <span class="status-dot"></span>
                系統已登錄
            </div>
            <a href="/portal/logout" class="logout-btn">🚪 完全登出</a>
        </div>

        <div class="header">
            <h1>請選擇功能</h1>
            <p>根據您的角色選擇要執行的操作</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <div class="choice-grid">
            <!-- 驗證功能 -->
            <a href="/login" class="choice-card verify">
                <div class="icon">🔍</div>
                <h2>PDF 驗證</h2>
                <p>上傳 PDF 合同進行完整性驗證<br>適用於財務人員在付款前審核合同</p>
                <span class="tag">財務人員使用</span>
            </a>

            <!-- 哈希錄入功能 -->
            <a href="/admin/login" class="choice-card admin">
                <div class="icon">📝</div>
                <h2>哈希錄入</h2>
                <p>將原始合同哈希錄入白名單<br>適用於管理員建立信任基線</p>
                <span class="tag">管理員使用</span>
            </a>
        </div>

    </div>
</body>
</html>
